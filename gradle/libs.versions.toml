[versions]
kotlin = "2.2.21"
spotless = "7.0.2"
ktlint = "1.5.0"
sqldelight = "2.1.0"
opendal = "0.50.6"
uuid = "6.1.1"
coroutines = "1.10.2"
serialization = "1.9.0"
slf4j = "2.0.17"
cron-utils = "9.2.1"
junit = "5.11.4"
ktor = "3.3.1"
snakeyaml = "2.7"
sqlite-jdbc = "3.49.1.0"

[libraries]
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cron-utils" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
uuid = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
opendal = { module = "org.apache.opendal:opendal", version.ref = "opendal" }
sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
