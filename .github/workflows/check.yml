name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ubuntu-latest is Linux x64; scripts/dev installs the matching project-local JDK and
# refuses unlisted platforms, so no runner can silently build on a different architecture.
# No preinstalled JDK is used — bootstrap installs the project JDK from
# gradle/toolchain.versions, so no version is duplicated here.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (ubuntu-latest, Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap project toolchain
        run: ./scripts/dev bootstrap

      # shell: bash enables `-eo pipefail`, without it `| tee` would mask the check's exit code.
      - name: Check (compile + test + format)
        shell: bash
        run: ./scripts/check 2>&1 | tee .local/tmp/ci-check.log

      # Always upload: a failing build's logs are exactly what we need to diagnose.
      # spotlessCheck reports through the console, so the log is the format report.
      - name: Upload test and check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/test-results/test/*.xml
            .local/tmp/ci-check.log
